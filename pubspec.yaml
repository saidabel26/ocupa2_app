name: ocupa2_app
description: "Plataforma de empleos temporales para estudiantes del ITLA."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  youtube_player_flutter: ^10.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.png"
